<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="SignUp.css">
    <title>Signup Form</title>
</head>
<body>
<div class="container">
    <!-- Left Section -->
    <div class="text-section">
        <h1>Roll the Carpet.!</h1>
        <div class="dashed-line-wrapper ">
        <button class="cta-button">Skip the lag ?</button>
            <span class="dashed-line"></span>
        </div>
    </div>


    <!-- Right Section with Form -->
    <div class="form-section-wrapper">
        <img class="circle-image" src="./asserts/BNG/Ellipse%201.png" alt="Decorative Circle" />

        <div class="form-section">
            <h2>Signup</h2>
            <p>Just some details to get you in.!</p>

            <input type="text" placeholder="Username" />
            <input type="email" placeholder="Email / Phone" />
            <input type="password" placeholder="Password" />
            <input type="password" placeholder="Confirm Password" />

            <button>Signup</button>

            <div class="social-login-section">
                <div class="line-wrapper">
                    <span class="line"></span>
                    <p>Or</p>
                    <span class="line"></span>
                </div>
                <div class="social-login">
                    <i class="fab fa-google"></i>
                    <i class="fab fa-facebook-f"></i>
                    <i class="fab fa-github"></i>
                </div>
                <p class="already-registered">
                    Already Registered? <a href="../Login/logIn.html">Login</a>
                </p>
                <div class="footer-links">
                    <a href="#">Terms & Conditions</a>
                    <a href="#">Support</a>
                    <a href="#">Customer Care</a>
                </div>
            </div>
        </div>

        <img class="circle-image-2" src="./asserts/BNG/Ellipse%201.png" alt="Decorative Circle" />
    </div>
</div>
</body>
</html>
